# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "karin"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
description = "An independent native Linux client for Yandex Music"
repository = "https://github.com/tracerxbrhd/karin"
license = "GPL-3.0-or-later"
publish = false

[features]
default = ["cassette-auth"]
# Functional prototype: Cassette-compatible, consenting per-window session.
cassette-auth = ["auth-webkit"]
# Local owner experiments only; default builds contain no Device Flow provider.
experimental-device-auth = []
# Isolated login component, also used by the Cassette-compatible provider.
auth-webkit = ["dep:webkit6"]

[dependencies]
base64 = "0.22"
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.10", features = ["v4_14"] }
gstreamer = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
ring = "0.17"
roxmltree = "=0.21.1"
rustix = { version = "1", features = ["termios", "event"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
zeroize = "1"
webkit6 = { version = "=0.5.0", optional = true, default-features = false }

[profile.dev]
debug = 0

[profile.test]
debug = 0
