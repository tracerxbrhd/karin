x="788" y="246" font-size="10" font-weight="400" fill="#25252a" text-anchor="middle">Next</text><text x="28" y="436" font-size="13" font-weight="400" fill="#25252a" text-anchor="start">Открытие/закрытие: вся поверхность движется целиком; режим меняется внутри без повторного выезда.</text><text x="28" y="465" font-size="13" font-weight="400" fill="#666671" text-anchor="start">Внешние клики и смена трека сохраняют панель. Закрытие: X / Ctrl+I или Ctrl+J текущего режима / Back.</text><text x="28" y="494" font-size="13" font-weight="400" fill="#666671" text-anchor="start">Shuffle и Repeat управляют локальной очередью и MPRIS. Stop остаётся системным действием.</text></g></svg>
