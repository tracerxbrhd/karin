# SPDX-License-Identifier: GPL-3.0-or-later
name: Extended diagnostics and Flatpak acceptance (manual)

# Optional signed-out diagnostic gallery. Populated System, motion, cold footer,
# lyrics glyphs, High Contrast and targeted HiDPI remain required in ci.yml.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Native gallery, cold profiling or isolated Flatpak acceptance
        type: choice
        options: [gallery, cold-profile, flatpak-acceptance]
        default: gallery

permissions:
  contents: read

concurrency:
  group: extended-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gallery:
    if: inputs.mode != 'flatpak-acceptance'
    name: ${{ inputs.mode == 'cold-profile' && 'Cold render profiling (software GL/Cairo)' || 'Native capture gallery' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: rust:1.98.1-slim-trixie@sha256:4cd829461bd5c4d511c32e269da9cb8929223b666519d8004e35fc8d1d771ab7
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: 0
      RUSTUP_TOOLCHAIN: stable
      KARIN_CAPTURE_RENDERER: ngl
      LP_NUM_THREADS: 2
    steps:
      - name: Install native capture dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get -o APT::Update::Error-Mode=any -o Acquire::Retries=2 -o Acquire::https::Timeout=20 update
          apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=20 install -y --no-install-recommends \
            build-essential pkg-config git python3 ca-certificates \
            libgtk-4-dev libadwaita-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libssl-dev libdbus-1-dev libsecret-1-dev libwebkitgtk-6.0-dev \
            dbus-x11 xvfb xauth librsvg2-common adwaita-icon-theme fonts-cantarell \
            fonts-dejavu-core openbox imagemagick xdotool wmctrl x11-utils \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libgl1-mesa-dri libegl-mesa0 libglx-mesa0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node.js 24
      - name: Configure this isolated capture runner
        id: rust
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rustup toolchain install stable --profile minimal
          echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import os
          from pathlib import Path
          cpus = len(os.sched_getaffinity(0))
          memory = int(next(line.split()[1] for line in Path('/proc/meminfo').read_text().splitlines() if line.startswith('MemAvailable:'))) * 1024
          limit = Path('/sys/fs/cgroup/memory.max')
          if limit.exists() and limit.read_text().strip().isdigit():
              memory = min(memory, int(limit.read_text()))
          jobs = min(cpus, max(1, (memory - 2 * 1024**3) // (3 * 1024**3)))
          print(f'Runner CPUs={cpus}; available/cgroup bytes={memory}; Cargo jobs={jobs}')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'CARGO_BUILD_JOBS={jobs}\n')
          PY
      - name: Cache this compiler/target/default capture configuration
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5, Node.js 24
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: cargo-debian13-${{ steps.rust.outputs.version }}-x86_64-manual-${{ inputs.mode }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'build.rs') }}-${{ hashFiles('src/**', 'resources/**') }}
          restore-keys: cargo-debian13-${{ steps.rust.outputs.version }}-x86_64-manual-${{ inputs.mode }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'build.rs') }}-
      - name: Build the ordinary client and capture both scales
        if: inputs.mode != 'cold-profile'
        run: |
          cargo build --workspace --locked
          scripts/capture-ui.sh build/ui-captures
          KARIN_CAPTURE_SCALE=2 scripts/capture-ui.sh build/ui-captures/hidpi
      - name: Retain the optional gallery
        if: always() && inputs.mode != 'cold-profile'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node.js 24
        with:
          name: karin-extended-gallery-${{ github.sha }}
          path: build/ui-captures/
          retention-days: 7
          if-no-files-found: error

      - name: Profile first and repeated footer reveals in fresh processes
        if: inputs.mode == 'cold-profile'
        run: |
          cargo test --lib --all-features --locked --no-run --message-format=json > /tmp/karin-cold-artifacts.jsonl
          binary=$(python3 scripts/ci-native-tests.py artifact /tmp/karin-cold-artifacts.jsonl)
          mkdir -p build/cold-render
          {
            git rev-parse HEAD
            git diff --exit-code
            rustc --version --verbose
            for package in gtk4 libadwaita-1 gstreamer-1.0 webkitgtk-6.0; do
              printf '%s: ' "$package"; pkg-config --modversion "$package"
            done
            sha256sum "$binary" scripts/observe-cold-playerbar.sh scripts/cold-playerbar-timing.c src/ui/music/design_tests.rs
          } > build/cold-render/source-and-environment.txt
          for attempt in 1 2; do
            for renderer in ngl cairo; do
              for mode in control trace; do
                scripts/observe-cold-playerbar.sh "$mode" "$binary" "build/cold-render/$renderer-$mode-$attempt" "$renderer" xvfb
              done
            done
          done
      - name: Retain bounded cold-render traces and provenance
        if: always() && inputs.mode == 'cold-profile'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node.js 24
        with:
          name: karin-cold-render-${{ github.sha }}
          path: build/cold-render/
          retention-days: 7
          if-no-files-found: error

  flatpak_acceptance:
    name: Flatpak source build and installed smoke
    if: inputs.mode == 'flatpak-acceptance'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install build tools and the GNOME SDK in the test runner
        run: |
          sudo apt-get -o APT::Update::Error-Mode=any -o Acquire::Retries=2 update
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends \
            appstream appstream-compose desktop-file-utils elfutils flatpak flatpak-builder ostree \
            dbus-x11 xvfb xauth
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.gnome.Platform//50 org.gnome.Sdk//50 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08
      - name: Build the exact prepared source and verify the exported bundle
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cargo fetch --locked
          python3 packaging/flatpak/prepare-source.py
          python3 packaging/release/manifest.py --revision "$GITHUB_SHA" \
            --output build/pinned/io.github.tracerxbrhd.Karin.json
          dbus-run-session -- python3 packaging/release/artifacts.py flatpak --revision "$GITHUB_SHA" \
            --manifest build/pinned/io.github.tracerxbrhd.Karin.json \
            --source-dir build/flatpak-source --output build/flatpak-acceptance
          cd build/flatpak-acceptance
          bundle=(karin-*.flatpak)
          test "${#bundle[@]}" -eq 1
          acceptance="${bundle[0]%.flatpak}-$(uname -m)-acceptance.flatpak"
          mv -- "${bundle[0]}" "$acceptance"
          flatpak uninstall --user --noninteractive io.github.tracerxbrhd.Karin
          dbus-run-session -- flatpak install --user --noninteractive --bundle "./$acceptance"
          flatpak run --user io.github.tracerxbrhd.Karin --version | grep -Fx "Source commit: $GITHUB_SHA"
          GTK_A11Y=none GSK_RENDERER=cairo dbus-run-session -- xvfb-run -a \
            flatpak run --user io.github.tracerxbrhd.Karin --smoke-test
          sha256sum "$acceptance" karin-*-source.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Retain the isolated test bundle and corresponding source
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: karin-flatpak-acceptance-${{ github.sha }}
          path: |
            build/flatpak-acceptance/*-acceptance.flatpak
            build/flatpak-acceptance/*-source.tar.gz
            build/flatpak-acceptance/*-flatpak.BUILD-INFO.json
            build/flatpak-acceptance/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
