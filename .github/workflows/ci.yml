# SPDX-License-Identifier: GPL-3.0-or-later
name: Rust and native diagnostics

# A feature commit is checked once through its PR; master is checked after merge.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  verify:
    # Preserve the published checks used by PR status/branch settings.
    name: Rust ${{ matrix.toolchain }} (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: stable
            toolchain: stable
          - lane: msrv
            toolchain: '1.98.1'
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      XDG_CONFIG_HOME: ${{ github.workspace }}/build/ci-xdg/config
      XDG_CACHE_HOME: ${{ github.workspace }}/build/ci-xdg/cache
      XDG_DATA_HOME: ${{ github.workspace }}/build/ci-xdg/data
      XDG_STATE_HOME: ${{ github.workspace }}/build/ci-xdg/state
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node.js 24
      - name: Install native development dependencies
        timeout-minutes: 10
        run: |
          # The archive/Azure mirror DNS failures exhausted the whole job on
          # 1fd4028. Use the reachable Ubuntu mirror over verified HTTPS, keeping
          # the exact suites, package signatures and Signed-By configuration.
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          # Hosted Ubuntu also uses mirror+file:/etc/apt/apt-mirrors.txt.
          sources = [Path('/etc/apt/sources.list'), Path('/etc/apt/apt-mirrors.txt')]
          changed = 0
          sources += list(Path('/etc/apt/sources.list.d').glob('*.sources'))
          sources += list(Path('/etc/apt/sources.list.d').glob('*.list'))
          for source in sources:
              if source.is_file():
                  original = source.read_text()
                  updated = original
                  for host in ('azure.archive.ubuntu.com', 'archive.ubuntu.com',
                               'security.ubuntu.com', 'us.archive.ubuntu.com',
                               'us-east-2.ec2.archive.ubuntu.com'):
                      for scheme in ('http', 'https'):
                          updated = updated.replace(f'{scheme}://{host}/',
                                                    'https://mirrors.edge.kernel.org/')
                  if updated != original:
                      source.write_text(updated)
                      changed += 1
          print(f'Ubuntu archive selection: {changed} source files updated')
          PYTHON
          # An unsuccessful index refresh must not silently use stale indexes
          # and then spend 45 minutes retrying every unavailable package.
          install_native() {
            sudo apt-get -o APT::Update::Error-Mode=any -o Acquire::Retries=2 \
              -o Acquire::https::Timeout=20 update &&
            sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=20 \
              install -y --no-install-recommends \
              build-essential pkg-config libgtk-4-dev libadwaita-1-dev \
              libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
              gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
              libssl-dev libdbus-1-dev libsecret-1-dev libwebkitgtk-6.0-dev dbus-x11 xvfb xauth \
              librsvg2-common openbox imagemagick xdotool wmctrl x11-utils apparmor \
              playerctl libglib2.0-bin python3-gi at-spi2-core libgl1-mesa-dri libegl-mesa0 libglx-mesa0 \
              appstream desktop-file-utils
          }
          if ! install_native; then
            # A resolved kernel-mirror IPv4 timed out during package fetching on
            # 2ab6d28. One official Ubuntu HTTPS fallback covers update and
            # mid-install transport failures; apt still verifies every signature.
            echo 'Native dependency setup: retrying once with official Ubuntu archive'
            sudo python3 - <<'PYTHON'
          from pathlib import Path
          import re
          sources = [Path('/etc/apt/sources.list'), Path('/etc/apt/apt-mirrors.txt')]
          sources += list(Path('/etc/apt/sources.list.d').glob('*.sources'))
          sources += list(Path('/etc/apt/sources.list.d').glob('*.list'))
          changed = 0
          for source in sources:
              if source.is_file():
                  original = source.read_text()
                  updated = re.sub(
                      r'https://mirrors\.edge\.kernel\.org/ubuntu(?=/|\s|$)',
                      'https://archive.ubuntu.com/ubuntu', original)
                  if updated != original:
                      source.write_text(updated)
                      changed += 1
          assert changed, 'No known Ubuntu mirror source was available for fallback'
          print(f'Ubuntu archive fallback: {changed} source files updated')
          PYTHON
            install_native
          fi
      - name: Install selected Rust toolchain and size compilation to this runner
        id: rust
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustc --version --verbose
          cargo --version
          echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import os
          from pathlib import Path
          cpus = len(os.sched_getaffinity(0))
          memory = int(next(line.split()[1] for line in Path('/proc/meminfo').read_text().splitlines() if line.startswith('MemAvailable:'))) * 1024
          limit = Path('/sys/fs/cgroup/memory.max')
          if limit.exists() and limit.read_text().strip().isdigit():
              memory = min(memory, int(limit.read_text()))
          # Allow 3 GiB per concurrent rustc (gtk4 is the largest), retaining
          # 2 GiB for the OS. Never invent more workers than available CPUs.
          jobs = min(cpus, max(1, (memory - 2 * 1024**3) // (3 * 1024**3)))
          print(f'Runner CPUs={cpus}; available/cgroup bytes={memory}; Cargo jobs={jobs}')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'CARGO_BUILD_JOBS={jobs}\n')
          PY
      - name: Cache locked Cargo inputs and this compiler/target/feature build set
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5, Node.js 24
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ubuntu24-${{ steps.rust.outputs.version }}-x86_64-default-all-min-release-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'build.rs') }}-${{ hashFiles('src/**', 'resources/**') }}
          restore-keys: cargo-ubuntu24-${{ steps.rust.outputs.version }}-x86_64-default-all-min-release-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'build.rs') }}-
      - name: Formatting and exact MSRV declaration
        run: |
          cargo fmt --all -- --check
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          assert tomllib.loads(Path('Cargo.toml').read_text())['package']['rust-version'] == '1.98'
          PY
      - name: Verify incremental build identity and source snapshot markers
        if: matrix.lane == 'stable'
        run: python3 scripts/test-build-identity.py
      - name: Verify prototype authentication build policy
        if: matrix.lane == 'stable'
        run: |
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          cargo = tomllib.loads(Path("Cargo.toml").read_text())
          features = cargo.get("features", {})
          pending = list(features.get("default", []))
          seen = set()
          while pending:
              feature = pending.pop()
              if feature not in seen:
                  seen.add(feature)
                  pending.extend(features.get(feature, []))
          assert "experimental-device-auth" not in seen, "Experimental OAuth must remain opt-in"
          assert {"cassette-auth", "auth-webkit"} <= seen, "The ordinary prototype must include its WebKit session provider"
          manifest = json.loads(Path("packaging/flatpak/io.github.tracerxbrhd.Karin.json").read_text())
          assert manifest["runtime"] == "org.gnome.Platform" and manifest["runtime-version"] == "50"
          assert manifest["sdk"] == "org.gnome.Sdk"
          assert manifest["sdk-extensions"] == ["org.freedesktop.Sdk.Extension.rust-stable"]
          commands = manifest["modules"][0]["build-commands"]
          assert "cargo build --release --offline --locked --no-default-features --features cassette-auth" in commands
          assert all("--all-features" not in command and "experimental-device-auth" not in command for command in commands)
          assert all("--experimental-music" not in command for command in commands)
          assert not any(arg.startswith("--filesystem=") or "org.freedesktop.secrets" in arg for arg in manifest["finish-args"])
          finish_args = manifest["finish-args"]
          assert [arg for arg in finish_args if arg.startswith("--own-name=")] == [
              "--own-name=org.mpris.MediaPlayer2.io.github.tracerxbrhd.Karin"
          ], "Expose only Karin's exact MPRIS name"
          assert "--socket=session-bus" not in finish_args
          assert not any(arg.startswith("--talk-name=") or arg.startswith("--system-talk-name=") for arg in finish_args)
          PY
      - name: Validate release metadata and pinned-source packaging contracts
        if: matrix.lane == 'stable'
        run: |
          python3 - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('packaging/release', pattern='test_*.py')
          assert suite.countTestCases() > 0, 'Release packaging tests were not discovered'
          raise SystemExit(not unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful())
          PY
          appstreamcli validate --no-net --pedantic packaging/io.github.tracerxbrhd.Karin.metainfo.xml
          desktop-file-validate packaging/io.github.tracerxbrhd.Karin.desktop
          bash -n scripts/observe-cold-playerbar.sh
          cc -O2 -Wall -Wextra -Werror -shared -fPIC scripts/cold-playerbar-timing.c -ldl -o /tmp/karin-cold-timing.so
      - name: Strict Clippy and default/all/minimal tests on both toolchains
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings
          cargo test --workspace --no-default-features --locked
          cargo build --workspace --no-default-features --locked
      - name: Select and verify the compiled all-features native suite
        run: |
          cargo test --lib --all-features --locked --no-run --message-format=json > /tmp/karin-native-artifacts.jsonl
          binary=$(python3 scripts/ci-native-tests.py artifact /tmp/karin-native-artifacts.jsonl)
          echo "KARIN_NATIVE_TEST_BINARY=$binary" >> "$GITHUB_ENV"
          python3 scripts/ci-native-tests.py verify "$binary"
      - name: MPRIS and protected Secret Service/Portal protocols
        run: python3 scripts/ci-native-tests.py run bus "$KARIN_NATIVE_TEST_BINARY"
      - name: Complete GTK/GStreamer/cache/Wave/queue/playlist/Lyrics/search regressions
        if: matrix.lane == 'stable'
        run: |
          for plugin in lamemp3enc xingmux mpg123audiodec souphttpsrc; do gst-inspect-1.0 "$plugin" >/dev/null; done
          python3 scripts/ci-native-tests.py run functional "$KARIN_NATIVE_TEST_BINARY"
      - name: Targeted HiDPI adaptive shell, search, Lyrics, footer and artwork
        if: matrix.lane == 'stable'
        run: python3 scripts/ci-native-tests.py run hidpi "$KARIN_NATIVE_TEST_BINARY" --scale 2
      - name: MSRV native layout and real resolver/playback compatibility
        if: matrix.lane == 'msrv'
        run: python3 scripts/ci-native-tests.py run compatibility "$KARIN_NATIVE_TEST_BINARY"
      - name: Permit sandbox namespaces only for the compiled WebKit test
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          restriction = Path('/proc/sys/kernel/apparmor_restrict_unprivileged_userns')
          if restriction.exists() and restriction.read_text().strip() == '1':
              binary = Path(os.environ['KARIN_NATIVE_TEST_BINARY']).resolve()
              workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()
              # Cargo 1.100 moved test executables from debug/deps to this
              # exact crate/hash/out layout. Admit only those two known layouts;
              # the AppArmor attachment still names this single compiled ELF.
              name = re.fullmatch(r'karin-([0-9a-f]{16})', binary.name)
              assert name, 'Unexpected library test executable name'
              expected = {
                  workspace / 'target/debug/deps',
                  workspace / 'target/debug/build/karin' / name.group(1) / 'out',
              }
              assert binary.parent in expected, 'Unexpected compiled test directory'
              assert binary.is_file() and os.access(binary, os.X_OK)
              assert re.fullmatch(r'[A-Za-z0-9_./-]+', str(binary)), 'Unsafe profile attachment path'
              # Ubuntu 24.04 requires a labelled parent app for WebKit's bwrap
              # uid-map setup, as in its shipped Epiphany profile. No global
              # sysctl, bwrap-wide allowance or WebKit sandbox setting changes.
              profile = ('abi <abi/4.0>,\ninclude <tunables/global>\n'
                         f'profile karin-webkit-ci "{binary}" flags=(unconfined) {{\n  userns,\n}}\n')
              Path('/tmp/karin-webkit-ci.apparmor').write_text(profile)
              print('Prepared CI-only userns permission for the exact library test executable')
          PY
          if [ -f /tmp/karin-webkit-ci.apparmor ]; then
            sudo apparmor_parser -r /tmp/karin-webkit-ci.apparmor
            test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          fi
      - name: Navigating WebKit sandbox, input, callbacks, cookies and cancellation
        run: |
          ulimit -c 0
          python3 scripts/ci-native-tests.py run webkit "$KARIN_NATIVE_TEST_BINARY"
      - name: Remove the CI-only namespace permission
        if: always()
        run: |
          if [ -f /tmp/karin-webkit-ci.apparmor ]; then
            sudo apparmor_parser -R /tmp/karin-webkit-ci.apparmor
            test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          fi
      - name: Build and smoke-test optional authentication components
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
        run: |
          cargo build --workspace --all-features --locked
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24 -dpi 96' ./target/debug/karin --experimental-music --smoke-test
      - name: Build ordinary client and test OAuth, Wave and real playback controls
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
          G_DEBUG: fatal-warnings
        run: |
          cargo build --workspace --locked
          python3 scripts/test-oauth-terminal.py ./target/debug/karin
          xvfb-run -a -s '-screen 0 1920x1080x24 -dpi 96' python3 scripts/test-wave-launch.py ./target/debug/karin
          ./target/debug/karin --audio-self-test
          ./target/debug/karin --playback-self-test
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24 -dpi 96' ./target/debug/karin --smoke-test
      - name: Ordinary executable consented Lyrics, style migration and global search
        if: matrix.lane == 'stable'
        env:
          GTK_A11Y: atspi
          GSK_RENDERER: cairo
        run: |
          GDK_SCALE=1 dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24 -dpi 96' /usr/bin/python3 scripts/test-application-fixture.py ./target/debug/karin --expected-revision "$(git rev-parse HEAD)" --theme dark --out build/executable/debug-1
      - name: Verify reviewed dependency licenses
        run: |
          python3 packaging/license_inventory.py --output /tmp/karin-dependency-licenses.md
          diff -u docs/DEPENDENCY_LICENSES.md /tmp/karin-dependency-licenses.md
      - name: Prepare and verify the exact Flatpak source and locked offline release
        if: matrix.lane == 'msrv'
        run: |
          cargo fetch --locked
          python3 packaging/flatpak/prepare-source.py
          test "$(cat build/flatpak-source/BUILD-REVISION)" = "$(git rev-parse HEAD)"
          test "$(cat build/flatpak-source/BUILD-SOURCE-STATUS)" = clean
          git diff --exit-code -- Cargo.lock packaging/flatpak/io.github.tracerxbrhd.Karin.json
          cd build/flatpak-source
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build --release --offline --locked --no-default-features --features cassette-auth
      - name: Release provider, Lyrics/search, OAuth, real playback and GTK startup
        if: matrix.lane == 'msrv'
        env:
          GTK_A11Y: atspi
          GSK_RENDERER: cairo
          GDK_SCALE: 1
        run: |
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24 -dpi 96' /usr/bin/python3 scripts/test-application-fixture.py ./target/release/karin --expected-revision "$(git rev-parse HEAD)" --theme light --out build/executable/release-1
          python3 scripts/test-oauth-terminal.py ./target/release/karin
          ./target/release/karin --audio-self-test
          ./target/release/karin --playback-self-test
          GTK_A11Y=none dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24 -dpi 96' ./target/release/karin --smoke-test
      - name: Package the native prototype with source identity and complete notices
        if: matrix.lane == 'msrv'
        run: |
          artifact=build/karin-fedora-prototype-1.98.1
          mkdir -p "$artifact/licenses/cassette-auth"
          install -m755 target/release/karin "$artifact/karin"
          cp LICENSE docs/LICENSING.md "$artifact/licenses/"
          cp packaging/third-party-licenses/cassette-auth/{COPYING,PROVENANCE.md} "$artifact/licenses/cassette-auth/"
          python3 packaging/license_inventory.py --output "$artifact/licenses/DEPENDENCY_LICENSES.md" --notices-dir "$artifact/licenses/rust"
          {
            printf 'Source commit: '; git rev-parse HEAD
            printf 'Build: --release --offline --locked --no-default-features --features cassette-auth\n'
            rustc --version --verbose
            cargo --version
            printf 'Ubuntu 24.04 x86_64 native prototype; not a Flatpak or public release.\n'
            printf 'Binary SHA256: '; sha256sum target/release/karin
          } > "$artifact/BUILD-INFO.txt"
          tar -C build -czf build/karin-fedora-prototype-1.98.1.tar.gz karin-fedora-prototype-1.98.1
          (cd build && sha256sum karin-fedora-prototype-1.98.1.tar.gz > SHA256SUMS)
      - name: Retain the native Fedora prototype
        if: matrix.lane == 'msrv'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node.js 24
        with:
          name: karin-fedora-prototype-1.98.1
          path: |
            build/karin-fedora-prototype-1.98.1.tar.gz
            build/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
      - name: Retain native receipts and executable evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node.js 24
        with:
          name: karin-functional-${{ matrix.lane }}-${{ github.sha }}
          path: |
            build/native-tests/
            build/executable/
          retention-days: 7
          if-no-files-found: error

  native_ui:
    name: Native UI ${{ matrix.toolchain }} (Debian 13)
    runs-on: ubuntu-24.04
    container:
      image: rust:1.98.1-slim-trixie@sha256:4cd829461bd5c4d511c32e269da9cb8929223b666519d8004e35fc8d1d771ab7
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: stable
            toolchain: stable
          - lane: msrv
            toolchain: '1.98.1'
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Bound software Mesa capture workers, without changing production rendering.
      LP_NUM_THREADS: 2
    steps:
      - name: Install modern native UI dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get -o APT::Update::Error-Mode=any -o Acquire::Retries=2 -o Acquire::https::Timeout=20 update
          apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=20 install -y --no-install-recommends \
            build-essential pkg-config python3 git ca-certificates \
            libgtk-4-dev libadwaita-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libssl-dev libdbus-1-dev libsecret-1-dev libwebkitgtk-6.0-dev dbus-x11 xvfb xauth \
            librsvg2-common adwaita-icon-theme fonts-cantarell fonts-dejavu-core \
            openbox imagemagick xdotool wmctrl x11-utils \
            libgl1-mesa-dri libegl-mesa0 libglx-mesa0
          pkg-config --atleast-version=4.18 gtk4
          pkg-config --atleast-version=1.7 libadwaita-1
          printf 'XDG_CONFIG_HOME=%s/build/ci-ui-xdg/config\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'XDG_CACHE_HOME=%s/build/ci-ui-xdg/cache\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'XDG_DATA_HOME=%s/build/ci-ui-xdg/data\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'XDG_STATE_HOME=%s/build/ci-ui-xdg/state\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node.js 24
      - name: Trust only the checked-out container workspace
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"
      - name: Install selected Rust toolchain and size compilation to this runner
        id: rust
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc --version --verbose
          cargo --version
          echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import os
          from pathlib import Path
          cpus = len(os.sched_getaffinity(0))
          memory = int(next(line.split()[1] for line in Path('/proc/meminfo').read_text().splitlines() if line.startswith('MemAvailable:'))) * 1024
          limit = Path('/sys/fs/cgroup/memory.max')
          if limit.exists() and limit.read_text().strip().isdigit():
              memory = min(memory, int(limit.read_text()))
          jobs = min(cpus, max(1, (memory - 2 * 1024**3) // (3 * 1024**3)))
          print(f'Runner CPUs={cpus}; available/cgroup bytes={memory}; Cargo jobs={jobs}')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'CARGO_BUILD_JOBS={jobs}\n')
          PY
      - name: Cache modern compiler/target/all-features test artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5, Node.js 24
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: cargo-debian13-${{ steps.rust.outputs.version }}-x86_64-all-features-test-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'build.rs') }}-${{ hashFiles('src/**', 'resources/**') }}
          restore-keys: cargo-debian13-${{ steps.rust.outputs.version }}-x86_64-all-features-test-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'build.rs') }}-
      - name: Compile the complete native suite once on each toolchain
        run: |
          cargo test --lib --all-features --locked --no-run --message-format=json > /tmp/karin-native-artifacts.jsonl
          binary=$(python3 scripts/ci-native-tests.py artifact /tmp/karin-native-artifacts.jsonl)
          echo "KARIN_NATIVE_TEST_BINARY=$binary" >> "$GITHUB_ENV"
          python3 scripts/ci-native-tests.py verify "$binary"
          mkdir -p build/native-tests
          {
            cat /etc/os-release
            rustc --version --verbose
            for package in gtk4 libadwaita-1 gstreamer-1.0 webkitgtk-6.0; do
              printf '%s: ' "$package"; pkg-config --modversion "$package"
            done
            printf 'Source HEAD: %s\n' "$SOURCE_HEAD_SHA"
            sha256sum "$binary"
          } > build/native-tests/environment.txt
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          files = subprocess.check_output(['git', 'ls-files', '-z', '--', 'src', 'resources', 'Cargo.toml', 'Cargo.lock'], text=True).split('\0')
          record = {'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                    'source_head_sha': os.environ['SOURCE_HEAD_SHA'],
                    'sources': {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in files if name}}
          Path('build/native-tests/source.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - name: System static surfaces, cold footer and normal/reduced motion at both scales
        if: matrix.lane == 'stable'
        run: |
          for scale in 1 2; do
            python3 scripts/ci-native-tests.py run visual "$KARIN_NATIVE_TEST_BINARY" --scale "$scale"
            python3 scripts/ci-native-tests.py run lyrics "$KARIN_NATIVE_TEST_BINARY" --scale "$scale" --output build/native-lyrics
          done
          python3 scripts/ci-native-tests.py run high-contrast "$KARIN_NATIVE_TEST_BINARY" --output build/native-high-contrast
      - name: Retain modern native evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node.js 24
        with:
          name: karin-native-visual-${{ matrix.lane }}-${{ github.sha }}
          path: |
            build/native-tests/
            build/native-lyrics/
            build/native-high-contrast/
          retention-days: 7
          if-no-files-found: error
