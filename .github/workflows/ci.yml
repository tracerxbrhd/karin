        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24 -dpi 96' ./target/release/karin --experimental-music --smoke-test
      - name: Restore ordinary session-provider release artifact on MSRV
        if: matrix.lane == 'msrv'
        run: cargo build --release --offline --locked --no-default-features --features cassette-auth
      - name: Prepare the native Fedora acceptance prototype
        if: matrix.lane == 'msrv'
        run: |
          artifact=build/karin-fedora-prototype-1.98.1
          mkdir -p "$artifact/licenses/cassette-auth"
          install -m755 target/release/karin "$artifact/karin"
          cp LICENSE docs/LICENSING.md "$artifact/licenses/"
          cp packaging/third-party-licenses/cassette-auth/{COPYING,PROVENANCE.md} "$artifact/licenses/cassette-auth/"
          python3 packaging/license_inventory.py --output "$artifact/licenses/DEPENDENCY_LICENSES.md" --notices-dir "$artifact/licenses/rust"
          {
            printf 'Source commit: '; git rev-parse HEAD
            printf 'Source URL: https://github.com/tracerxbrhd/karin/tree/%s\n' "$GITHUB_SHA"
            printf 'Features: --no-default-features --features cassette-auth\nBuild: --release --offline --locked\n'
            rustc --version --verbose
            cargo --version
            printf 'Build system: Ubuntu 24.04; architecture: '; uname -m
            for package in gtk4 libadwaita-1 gstreamer-1.0 webkitgtk-6.0; do
              printf '%s: ' "$package"; pkg-config --modversion "$package"
            done
            printf 'Binary SHA256: '; sha256sum target/release/karin
          } > "$artifact/BUILD-INFO.txt"
          cat > "$artifact/README.txt" <<'EOF'
          Karin v0.8: integrated music, library and performance acceptance build.
          Verify SHA256SUMS and BUILD-INFO.txt against this PR's exact head.
          This is an Ubuntu 24.04 x86_64 native prototype, not a Flatpak/public release.
          Fedora runtime: sudo dnf install gtk4 libadwaita gstreamer1 gstreamer1-plugins-base gstreamer1-plugins-good webkitgtk6.0 librsvg2 libsecret
          Optional MPRIS tool: sudo dnf install playerctl
          ulimit -c 0
          ./karin
          No experimental flag or developer credentials required. Keep the desktop keyring unlocked.
          Follow docs/BUILDING.md#v08-final-fedora-acceptance at the source commit in BUILD-INFO.txt.
          Test the real account/library/search/playlists/context queue, audible Music playback and KDE MPRIS.
          Inspect light/dark, HiDPI, 420x720,850x750,720x650,900x650,1280x800,1440x900,1650x930,1920x1080 and maximized.
          Open Track Info or Queue in the same right panel; outside click/scroll/navigation must not close it.
          Check the entire surface slides together and switching Track Info/Queue never closes/reopens it.
          Test Shuffle, Repeat Queue/One, previous-history, actual upcoming order and external playerctl modes.
          Queue is reached from the Player Bar/Ctrl+J; no separate queue navigation or visible Stop remains.
          Before Play the footer is hidden; real Play reveals it from below, Pause retains it, Stop/clear/logout hides it.
          Click cover/title/artist/metadata space or press Enter/Space to open Track Info; Like remains independent.
          Use Home (Wave Hero starts only on Listen after validated sign-in), Liked and Playlists tabs and the adjacent unified Search action.
          Scroll track collections continuously; exercise loading/end/error/Retry without manual track pages.
          Ordinary continuation is bounded at 2000 positions; explicit collection indexing admits up to 20000 source positions. Playback contexts stay bounded at 500.
          In Liked/opened playlists type title/artist/album locally; typing must not fetch collection pages or replace the playing Queue.
          Partial coverage is explicit; start collection indexing deliberately, verify its final membership check and retain exact duplicate occurrences in filtered playback.
          Inspect the heart hero/truthful duration, larger playlist covers and tight centered footer at 850x750 and compact/wide sizes.
          Direct Like must read membership and confirm the server result; unconfirmed Dislike is hidden.
          Next/Previous/EOS/MPRIS must follow the actual occurrence without closing/reopening.
          Explicit other-track selection must survive pause/seek/volume; current occurrence changes resume following.
          Resize wide/medium/compact and suspend via Diagnostics; open intent must survive.
          Close only via X, Ctrl+I or explicit compact Back. Logout must clear private state and pending jobs.
          Recheck restart/protected login/cache clearing/preferences and safe default-cancel logout.
          Cloud fixtures establish synthetic GTK behavior, not Fedora audio/keyring/KDE/Flatpak acceptance.
          Native and current Flatpak acceptance require separate local checks; no broad bus grants.
          Preserve GPL and third-party notices. Shared OAuth public-distribution/service permission remains unresolved separately.
          Do not enable network/GStreamer logs or share tokens, URLs, account data, private screenshots or audio.
          Private HTTP audio caching uses the current validated Legacy MP3 session, actual response directives and fresh representation validation; it is not a provider entitlement or an offline mode.
          The owner accepted audio caching at c1de869 and v0.7 at949d1f9 (68/68: Native34/34, installedFlatpak34/34); PR28 merged normally at2ab6d28. Follow docs/BUILDING.md#v08-final-fedora-acceptance for this build: lyrics/TEXT/LRC, similar tracks, full-collection indexing and sort, exact queue editing, and preserved playback/cache/auth/MPRIS/Wave. Cloud original-audio fixtures do not replace real-service acceptance of the new features.
          LRCLIB is a separate explicitly requested text source; its disclosed public artist/title/album/duration lookup sends no Music token or private account identifiers. Modern extracted-key lyrics signing is excluded. Karin Style remains unavailable pending designer materials.
          Settings has one enabled-by-default 2GiB shared cache allowance, six-position slider (500MiB/1/2/3/4GiB/Unlimited), measured total and Clear; no download/offline or permission-override controls.
          Active-footer Like and Dislike require independent live membership confirmation; Dislike stays hidden if unavailable, while fresh Like-only remains supported.
          Test separate marks, their removal/opposite clearing, pending/error GET recovery and exactly one Next after confirmed current Dislike; removal/Like/errors never advance or add new Wave events.
          My Wave is available in ordinary ./karin; no experimental flag is required and radio never starts automatically.
          Sign in normally or use the existing protected session, then Home -> Моя волна -> Слушать.
          Read docs/BUILDING.md#my-wave-local-acceptance for the complete bounded acceptance sequence.
          Keep only fixed Wave stage/category/http/event/phase/origin/finish and bounded counters; never enable network logs.
          A generated-media fixture is not proof of real radio, accepted service feedback or heard Yandex music.
          Report exact source revision and anonymized PASS/FAIL/not-assessed results only.
          EOF
          tar -C build -czf build/karin-fedora-prototype-1.98.1.tar.gz karin-fedora-prototype-1.98.1
          (cd build && sha256sum karin-fedora-prototype-1.98.1.tar.gz > SHA256SUMS)
      - name: Retain the native Fedora acceptance prototype
        if: matrix.lane == 'msrv'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node.js 24
        with:
          name: karin-fedora-prototype-1.98.1
          path: |
            build/karin-fedora-prototype-1.98.1.tar.gz
            build/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
      - name: Retain normal-app audio cache contract evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node.js 24
        with:
          name: karin-audio-cache-application-${{ matrix.lane }}-${{ github.sha }}
          path: |
            build/ui-captures/fixtures/audio-cache-application/audio-cache-application-receipt.json
            build/ui-captures/fixtures/audio-cache-application/audio-cache-lifecycle-receipt.json
            build/ui-captures/fixtures/audio-cache-application/audio-cache-completion-receipt.json
            build/ui-captures/fixtures/audio-cache-application/audio-cache-identity-receipt.json
            build/ui-captures/fixtures/audio-cache-application/audio-cache-presence-receipt.json
            build/ui-captures/fixtures/audio-cache-application/audio-cache-localfirst-receipt.json
            build/ui-captures/fixtures/audio-cache-application/audio-cache-saved-*.png
            build/ui-captures/fixtures/audio-cache-application/audio-cache-presence-*.png
            build/ui-captures/fixtures/audio-cache-application/audio-cache-application-*.log
          retention-days: 14
          if-no-files-found: error
      - name: Retain integrated playback, playlist and appearance contract evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node.js 24
        with:
          name: karin-v07-application-${{ matrix.lane }}-${{ github.sha }}
          path: |
            build/ui-captures/fixtures/v07-application/scale-*/v07-application-receipt.json
            build/ui-captures/fixtures/v07-application/scale-*/v07-application-*.log
            build/ui-captures/fixtures/v07-application/scale-*/v07-playlist-editor-*.png
          retention-days: 14
          if-no-files-found: error
      - name: Retain v0.8 functional input and marker-work evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node.js 24
        with:
          name: karin-v08-application-${{ matrix.lane }}-${{ github.sha }}
          path: build/ui-captures/fixtures/v08-application/
          retention-days: 14
          if-no-files-found: error
      - name: Retain Ubuntu functional UI evidence
        if: always() && matrix.lane == 'stable'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node.js 24
        with:
          name: karin-ui-${{ github.sha }}
          path: |
            build/ui-captures/**/*.png
            build/ui-captures/**/*.geometry.txt
            build/ui-captures/**/*.jsonl
          retention-days: 7
          if-no-files-found: error

  # Strict visual evidence uses the prepared modern native stack and recorded
  # graphics initialization. Ubuntu keeps compiler/package/functional coverage;
  # cold software-paint limits remain explicit in VALIDATION.md.
  # The motion fixture records graphics initialization separately before the
  # unchanged normal-animation phase gate. Cold first-use latency is not
  # accepted by this measurement; retain its raw observations and Fedora gate.
  native_ui:
    name: Native UI ${{ matrix.toolchain }} (Debian 13)
    runs-on: ubuntu-24.04
    container:
      image: rust:1.98.1-slim-trixie@sha256:4cd829461bd5c4d511c32e269da9cb8929223b666519d8004e35fc8d1d771ab7
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: stable
            toolchain: stable
          - lane: msrv
            toolchain: '1.98.1'
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Bound software Mesa raster workers in this isolated capture job, leaving
      # CPU capacity for GTK. This is not a production renderer/timing override;
      # retain the unmodified normal-motion guards and record the environment.
      LP_NUM_THREADS: 2
    steps:
      - name: Install modern native UI dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config python3 git ca-certificates \
            libgtk-4-dev libadwaita-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libssl-dev libdbus-1-dev libsecret-1-dev libwebkitgtk-6.0-dev dbus-x11 xvfb xauth \
            librsvg2-common adwaita-icon-theme fonts-cantarell fonts-dejavu-core \
            openbox imagemagick xdotool wmctrl x11-utils \
            libgl1-mesa-dri libegl-mesa0 libglx-mesa0
          pkg-config --atleast-version=4.18 gtk4
          pkg-config --atleast-version=1.7 libadwaita-1
          printf 'XDG_CONFIG_HOME=%s/build/ci-ui-xdg/config\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'XDG_CACHE_HOME=%s/build/ci-ui-xdg/cache\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'XDG_DATA_HOME=%s/build/ci-ui-xdg/data\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'XDG_STATE_HOME=%s/build/ci-ui-xdg/state\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node.js 24
      - name: Trust only the checked-out container workspace
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"
      - name: Install selected Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc --version
          cargo --version
      - name: Build modern native fixtures and ordinary offline-provider capture client
        run: |
          mkdir -p build/ui-captures
          cargo test --lib --all-features --locked --no-run --message-format=json > /tmp/karin-native-quality-artifacts.jsonl
          cargo build --workspace --locked
          cargo test --lib --all-features --locked -- --ignored --list > /tmp/karin-native-quality-fixtures.txt
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          listed = Path('/tmp/karin-native-quality-fixtures.txt').read_text().splitlines()
          for selector in ['native_design_matched_matrix_and_populated_surfaces',
                           'native_universal_panel_whole_surface_motion_and_mode_switch',
                           'native_first_footer_reveal_after_startup_without_graphics_initialization']:
              assert any(line.endswith(f'::{selector}: test') for line in listed), f'Missing compiled visual fixture: {selector}'
          artifacts = [json.loads(line) for line in Path('/tmp/karin-native-quality-artifacts.jsonl').read_text().splitlines()]
          binaries = [item['executable'] for item in artifacts
                      if item.get('reason') == 'compiler-artifact'
                      and item.get('target', {}).get('name') == 'karin'
                      and item.get('target', {}).get('kind') == ['lib']
                      and item.get('profile', {}).get('test') and item.get('executable')]
          assert len(binaries) == 1, 'Expected one compiled visual fixture executable'
          sources = subprocess.check_output(['git', 'ls-files', '-z', '--', 'src', 'resources', 'Cargo.toml', 'Cargo.lock']).decode().split('\0')
          record = {'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                    'source_head_sha': os.environ['SOURCE_HEAD_SHA'],
                    'rustc': subprocess.check_output(['rustc', '--version'], text=True).strip(),
                    'test_executable_sha256': hashlib.sha256(Path(binaries[0]).read_bytes()).hexdigest(),
                    'ordinary_binary_sha256': hashlib.sha256(Path('target/debug/karin').read_bytes()).hexdigest(),
                    'sources': {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in sources if name}}
          Path('build/ui-captures/native-quality-source.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
          {
            cat /etc/os-release
            rustc --version --verbose
            cargo --version
            for package in gtk4 libadwaita-1 gstreamer-1.0 webkitgtk-6.0; do
              printf '%s: ' "$package"; pkg-config --modversion "$package"
            done
            printf 'Capture: isolated Xvfb/Openbox, requested ngl/full-redraw, scale 1 and 2.\n'
            printf 'Fixtures record and assert the actual native renderer; no production renderer override.\n'
            printf 'Software Mesa raster worker limit: LP_NUM_THREADS=%s (capture environment only).\n' "$LP_NUM_THREADS"
            printf 'Static captures force full redraw; normal-motion checks unset GSK_DEBUG and use ordinary damage tracking.\n'
            printf 'Motion PNGs render complete real after-paint scene nodes; this is not framebuffer-damage or cold-latency acceptance.\n'
            printf 'Normal 240ms motion is measured after a separately recorded graphics initialization cycle; cold latency is not accepted.\n'
          } > build/ui-captures/native-quality-environment.txt
      - name: Fresh startup footer, populated matrix and initialized motion at both scales
        env:
          G_DEBUG: fatal-warnings
          GTK_A11Y: none
          GSK_RENDERER: ngl
          GSK_DEBUG: full-redraw
          GDK_DPI_SCALE: 1
          KARIN_V04_ASSERT_DENSITY: 1
        run: |
          # Observe fresh-process startup first, in its own profile. Neither
          # scale inherits settings/shader caches from the static/motion suite.
          for scale in 1 2; do
            if [ "$scale" = 1 ]; then screen=1920x1080x24; else screen=3840x2160x24; fi
            export KARIN_TEST_CAPTURE_DIR="$GITHUB_WORKSPACE/build/ui-captures/fixtures/native-music-$scale"
            cold_profile="$GITHUB_WORKSPACE/build/ci-ui-cold-$scale"
            test ! -e "$cold_profile"
            mkdir -p "$cold_profile/config" "$cold_profile/cache" "$cold_profile/data" "$cold_profile/state"
            env -u GSK_DEBUG GDK_SCALE="$scale" XDG_CONFIG_HOME="$cold_profile/config" XDG_CACHE_HOME="$cold_profile/cache" XDG_DATA_HOME="$cold_profile/data" XDG_STATE_HOME="$cold_profile/state" dbus-run-session -- xvfb-run -a -s "-screen 0 $screen -dpi 96" cargo test --lib --all-features --locked native_first_footer_reveal_after_startup_without_graphics_initialization -- --ignored --test-threads=1
          done
          for scale in 1 2; do
            if [ "$scale" = 1 ]; then screen=1920x1080x24; else screen=3840x2160x24; fi
            export KARIN_TEST_CAPTURE_DIR="$GITHUB_WORKSPACE/build/ui-captures/fixtures/native-music-$scale"
            GDK_SCALE="$scale" dbus-run-session -- xvfb-run -a -s "-screen 0 $screen -dpi 96" cargo test --lib --all-features --locked native_design_matched_matrix_and_populated_surfaces -- --ignored --test-threads=1
            env -u GSK_DEBUG GDK_SCALE="$scale" dbus-run-session -- xvfb-run -a -s "-screen 0 $screen -dpi 96" cargo test --lib --all-features --locked native_universal_panel_whole_surface_motion_and_mode_switch -- --ignored --test-threads=1
          done
      - name: Capture real GTK visual review matrix
        env:
          KARIN_CAPTURE_RENDERER: ngl
        run: scripts/capture-ui.sh build/ui-captures
      - name: Capture HiDPI GTK visual review matrix
        env:
          KARIN_CAPTURE_SCALE: 2
          KARIN_CAPTURE_RENDERER: ngl
        run: scripts/capture-ui.sh build/ui-captures/hidpi
      - name: Matched 2e3ae41 refinement baseline GTK captures (isolated target)
        env:
          KARIN_CAPTURE_RENDERER: ngl
        run: scripts/capture-native-music-baseline.sh build/ui-captures
      - name: Retain modern native visual evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node.js 24
        with:
          name: karin-native-visual-${{ matrix.lane }}-${{ github.sha }}
          path: |
            build/ui-captures/**/*.png
            build/ui-captures/**/*.geometry.txt
            build/ui-captures/**/*.jsonl
            build/ui-captures/**/*.json
            build/ui-captures/baseline-source.json
            build/ui-captures/baseline-geometry-adapter.patch
            build/ui-captures/native-quality-source.json
            build/ui-captures/native-quality-environment.txt
            build/ui-captures/comparison-info.txt
            build/ui-captures/capture-info.txt
            build/ui-captures/hidpi/capture-info.txt
          retention-days: 7
          if-no-files-found: error
