# SPDX-License-Identifier: GPL-3.0-or-later
name: Rust and native diagnostics

on:
  push:
    branches: [master, 'feature/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [master, 'feature/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Rust ${{ matrix.toolchain }} (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: stable
            toolchain: stable
          - lane: msrv
            toolchain: '1.98.1'
            rust-version: '1.98'
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      RUST_BACKTRACE: 1
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      XDG_CONFIG_HOME: ${{ github.workspace }}/build/ci-xdg/config
      XDG_CACHE_HOME: ${{ github.workspace }}/build/ci-xdg/cache
      XDG_DATA_HOME: ${{ github.workspace }}/build/ci-xdg/data
      XDG_STATE_HOME: ${{ github.workspace }}/build/ci-xdg/state
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node.js 24
      - name: Install native development dependencies
        timeout-minutes: 10
        run: |
          # The archive/Azure mirror DNS failures exhausted the whole job on
          # 1fd4028. Use the reachable Ubuntu mirror over verified HTTPS, keeping
          # the exact suites, package signatures and Signed-By configuration.
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          # Hosted Ubuntu also uses mirror+file:/etc/apt/apt-mirrors.txt.
          sources = [Path('/etc/apt/sources.list'), Path('/etc/apt/apt-mirrors.txt')]
          changed = 0
          sources += list(Path('/etc/apt/sources.list.d').glob('*.sources'))
          sources += list(Path('/etc/apt/sources.list.d').glob('*.list'))
          for source in sources:
              if source.is_file():
                  original = source.read_text()
                  updated = original
                  for host in ('azure.archive.ubuntu.com', 'archive.ubuntu.com',
                               'security.ubuntu.com', 'us.archive.ubuntu.com'):
                      for scheme in ('http', 'https'):
                          updated = updated.replace(f'{scheme}://{host}/',
                                                    'https://mirrors.edge.kernel.org/')
                  if updated != original:
                      source.write_text(updated)
                      changed += 1
          print(f'Ubuntu archive selection: {changed} source files updated')
          PYTHON
          # An unsuccessful index refresh must not silently use stale indexes
          # and then spend 45 minutes retrying every unavailable package.
          install_native() {
            sudo apt-get -o APT::Update::Error-Mode=any -o Acquire::Retries=2 \
              -o Acquire::https::Timeout=20 update &&
            sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=20 \
              install -y --no-install-recommends \
              build-essential pkg-config libgtk-4-dev libadwaita-1-dev \
              libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
              gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
              libssl-dev libdbus-1-dev libsecret-1-dev libwebkitgtk-6.0-dev dbus-x11 xvfb xauth \
              librsvg2-common openbox imagemagick xdotool wmctrl x11-utils apparmor \
              playerctl libglib2.0-bin libgl1-mesa-dri libegl-mesa0 libglx-mesa0
          }
          if ! install_native; then
            # A resolved kernel-mirror IPv4 timed out during package fetching on
            # 2ab6d28. One official Ubuntu HTTPS fallback covers update and
            # mid-install transport failures; apt still verifies every signature.
            echo 'Native dependency setup: retrying once with official Ubuntu archive'
            sudo python3 - <<'PYTHON'
          from pathlib import Path
          import re
          sources = [Path('/etc/apt/sources.list'), Path('/etc/apt/apt-mirrors.txt')]
          sources += list(Path('/etc/apt/sources.list.d').glob('*.sources'))
          sources += list(Path('/etc/apt/sources.list.d').glob('*.list'))
          changed = 0
          for source in sources:
              if source.is_file():
                  original = source.read_text()
                  updated = re.sub(
                      r'https://mirrors\.edge\.kernel\.org/ubuntu(?=/|\s|$)',
                      'https://archive.ubuntu.com/ubuntu', original)
                  if updated != original:
                      source.write_text(updated)
                      changed += 1
          assert changed, 'No known Ubuntu mirror source was available for fallback'
          print(f'Ubuntu archive fallback: {changed} source files updated')
          PYTHON
            install_native
          fi
      - name: Install selected Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustc --version
          cargo --version
      - name: Keep the MSRV lane aligned with Cargo metadata
        if: matrix.lane == 'msrv'
        env:
          EXPECTED_RUST_VERSION: ${{ matrix.rust-version }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          declared = tomllib.loads(Path("Cargo.toml").read_text())["package"]["rust-version"]
          expected = os.environ["EXPECTED_RUST_VERSION"]
          assert declared == expected, f"Cargo.toml declares {declared}; update the MSRV CI lane ({expected}) together"
          PY
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Verify prototype authentication build policy
        run: |
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          cargo = tomllib.loads(Path("Cargo.toml").read_text())
          features = cargo.get("features", {})
          pending = list(features.get("default", []))
          seen = set()
          while pending:
              feature = pending.pop()
              if feature not in seen:
                  seen.add(feature)
                  pending.extend(features.get(feature, []))
          assert "experimental-device-auth" not in seen, "Experimental OAuth must remain opt-in"
          assert {"cassette-auth", "auth-webkit"} <= seen, "The ordinary prototype must include its WebKit session provider"
          manifest = json.loads(Path("packaging/flatpak/io.github.tracerxbrhd.Karin.json").read_text())
          assert manifest["runtime"] == "org.gnome.Platform" and manifest["runtime-version"] == "50"
          assert manifest["sdk"] == "org.gnome.Sdk"
          assert manifest["sdk-extensions"] == ["org.freedesktop.Sdk.Extension.rust-stable"]
          commands = manifest["modules"][0]["build-commands"]
          assert "cargo build --release --offline --locked --no-default-features --features cassette-auth" in commands
          assert all("--all-features" not in command and "experimental-device-auth" not in command for command in commands)
          assert all("--experimental-music" not in command for command in commands)
          assert not any(arg.startswith("--filesystem=") or "org.freedesktop.secrets" in arg for arg in manifest["finish-args"])
          finish_args = manifest["finish-args"]
          assert [arg for arg in finish_args if arg.startswith("--own-name=")] == [
              "--own-name=org.mpris.MediaPlayer2.io.github.tracerxbrhd.Karin"
          ], "Expose only Karin's exact MPRIS name"
          assert "--socket=session-bus" not in finish_args
          assert not any(arg.startswith("--talk-name=") or arg.startswith("--system-talk-name=") for arg in finish_args)
          PY
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Experimental feature Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Unit and local integration tests
        run: cargo test --workspace --locked
      - name: Experimental feature tests (synthetic local HTTP only)
        run: cargo test --workspace --all-features --locked
      - name: Minimal no-WebKit compatibility
        run: |
          cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings
          cargo test --workspace --no-default-features --locked
          cargo build --workspace --no-default-features --locked
      - name: Verify explicit native fixture selectors exist
        run: |
          cargo test --lib --all-features --locked -- --ignored --list > /tmp/karin-v03-native-fixtures.txt
          python3 - <<'PY'
          import re
          from pathlib import Path

          listed = Path('/tmp/karin-v03-native-fixtures.txt').read_text().splitlines()
          selectors = [
              'native_secure_storage_secret_service_and_portal_protocol',
              'native_mpris_session_bus_methods_properties_signals_and_shutdown',
              'artwork_thumbnail_maps_caches_hidpi_and_cancels_without_network',
              'webkit_auth_interactive_navigation_frames_and_first_rejection',
              'webkit_auth_construction_and_shutdown_without_navigation',
              'webkit_auth_local_startup_cookie_isolation_and_cancel',
              'native_account_menu_logout_cancel_default_confirm_and_stale_session',
              'native_cover_metadata_http_cache_and_render_lifecycle',
              'native_visible_cover_retries_after_worker_queue_saturation_without_remap',
              'native_workspace_track_pane_actions_state_and_cleanup',
              'native_catalog_native_music_layout',
              'native_catalog_navigation_latest_actions',
              'native_library_interactions_confirmed_fixture',
              'native_catalog_rows_mouse_keyboard_details_and_delivery',
              'native_search_retry_normalized_results_and_density',
              'native_music_session_catalog_queue_and_logout',
              'native_music_context_mpris_shared_player_and_cleanup',
              'native_wave_shared_player_feedback_batches_and_cleanup',
              'native_wave_retirement_supported_feedback_and_cleanup',
              'native_wave_home_experiment_layout_and_controls',
              'native_music_playback_context_occurrences_and_shared_transport',
              'native_music_playback_media_error_visibility_stop_retry_and_catalog_preservation',
              'native_music_playback_queue_races_remove_and_close',
              'native_music_playback_resolver_queue_controls_and_logout',
              'native_design_matched_matrix_and_populated_surfaces',
              'native_universal_panel_whole_surface_motion_and_mode_switch',
              'native_first_footer_reveal_after_startup_without_graphics_initialization',
              'native_collection_filter_continuation_and_exact_occurrences',
              'native_music_shuffle_repeat_mpris_shared_policy_and_eos',
              'native_queue_space_mouse_enter_dispatch_exact_occurrence_once',
              'native_workspace_playlist_grid_input_states_and_resize',
              'native_workspace_full_shell_adaptive_pane_selection_navigation_and_cleanup',
              'native_preferences_persistent_controls_snapshot_updates_and_cleanup',
              'native_playlist_creation_confirmation_refresh_refusal_and_late_widgets',
              'native_persistent_session_restore_settings_forget_and_close',
              'native_audio_cache_application_process_restart',
              'native_v07_playback_restore_playlist_appearance_process_restart',
              'native_v08_lyrics_similar_seek_and_stale_selection',
              'native_v08_whole_collection_index_search_sort_and_cancellation',
              'native_v08_queue_next_drag_keyboard_and_restoration',
              'native_v08_incremental_marker_updates_and_stable_ticks',
              'native_catalog_cache_provenance_interleaving_and_retired_replies',
          ]
          compiled = {line.rsplit('::', 1)[-1].removesuffix(': test')
                      for line in listed if line.endswith(': test')}
          assert compiled == set(selectors), f'Native selector registration mismatch: {compiled ^ set(selectors)}'
          workflow = Path('.github/workflows/ci.yml').read_text()
          main, modern = workflow.split('\n  native_ui:', 1)
          pattern = r'cargo test --lib --all-features --locked ([a-z_0-9]+) -- --ignored'
          visual = {'native_design_matched_matrix_and_populated_surfaces',
                    'native_universal_panel_whole_surface_motion_and_mode_switch',
                    'native_first_footer_reveal_after_startup_without_graphics_initialization'}
          main_runs = set(re.findall(pattern, main))
          modern_runs = set(re.findall(pattern, modern))
          assert set(selectors) - visual <= main_runs, 'A functional native selector was removed from Ubuntu'
          assert not visual & main_runs, 'Strict visual selectors belong to the modern quality runtime'
          assert visual <= modern_runs, 'The modern job must execute every visual fixture'
          print(f'Compiled {len(compiled)} selectors: {len(compiled - visual)} Ubuntu functional + {len(visual)} modern visual, in both Rust lanes')
          PY
      - name: MPRIS methods, properties, signals and shutdown on an isolated session bus
        run: |
          command -v playerctl
          command -v gdbus
          dbus-run-session -- cargo test --lib --all-features --locked native_mpris_session_bus_methods_properties_signals_and_shutdown -- --ignored --test-threads=1
      - name: Protected session storage through isolated Secret Service and Portal fixtures
        env:
          KARIN_TEST_SECRET_BUS: 1
        run: dbus-run-session -- cargo test --lib --all-features --locked native_secure_storage_secret_service_and_portal_protocol -- --ignored --test-threads=1
      - name: Native music workspace, playlist creation and persistent preferences input and cleanup
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
          GSK_DEBUG: full-redraw
        run: |
          if [ '${{ matrix.lane }}' = stable ]; then
            export KARIN_TEST_CAPTURE_DIR="$GITHUB_WORKSPACE/build/ui-captures/fixtures"
          fi
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24 -dpi 96' cargo test --lib --all-features --locked native_workspace_track_pane_actions_state_and_cleanup -- --ignored --test-threads=1
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24 -dpi 96' cargo test --lib --all-features --locked native_workspace_playlist_grid_input_states_and_resize -- --ignored --test-threads=1
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24 -dpi 96' cargo test --lib --all-features --locked native_workspace_full_shell_adaptive_pane_selection_navigation_and_cleanup -- --ignored --test-threads=1
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24 -dpi 96' cargo test --lib --all-features --locked native_preferences_persistent_controls_snapshot_updates_and_cleanup -- --ignored --test-threads=1
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24 -dpi 96' cargo test --lib --all-features --locked native_playlist_creation_confirmation_refresh_refusal_and_late_widgets -- --ignored --test-threads=1
      - name: Native music workspace, playlist creation and persistent preferences at HiDPI
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
          GSK_DEBUG: full-redraw
          GDK_SCALE: 2
        run: |
          if [ '${{ matrix.lane }}' = stable ]; then
            export KARIN_TEST_CAPTURE_DIR="$GITHUB_WORKSPACE/build/ui-captures/fixtures/hidpi"
          fi
          dbus-run-session -- xvfb-run -a -s '-screen 0 3840x2160x24 -dpi 96' cargo test --lib --all-features --locked native_workspace_track_pane_actions_state_and_cleanup -- --ignored --test-threads=1
          dbus-run-session -- xvfb-run -a -s '-screen 0 3840x2160x24 -dpi 96' cargo test --lib --all-features --locked native_workspace_playlist_grid_input_states_and_resize -- --ignored --test-threads=1
          dbus-run-session -- xvfb-run -a -s '-screen 0 3840x2160x24 -dpi 96' cargo test --lib --all-features --locked native_workspace_full_shell_adaptive_pane_selection_navigation_and_cleanup -- --ignored --test-threads=1
          dbus-run-session -- xvfb-run -a -s '-screen 0 3840x2160x24 -dpi 96' cargo test --lib --all-features --locked native_preferences_persistent_controls_snapshot_updates_and_cleanup -- --ignored --test-threads=1
          dbus-run-session -- xvfb-run -a -s '-screen 0 3840x2160x24 -dpi 96' cargo test --lib --all-features --locked native_playlist_creation_confirmation_refresh_refusal_and_late_widgets -- --ignored --test-threads=1
      - name: Native Music layout, playback policy and exact queue input
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
          GSK_DEBUG: full-redraw
          KARIN_V04_ASSERT_DENSITY: 1
        run: |
          for scale in 1 2; do
            if [ "$scale" = 1 ]; then screen=1920x1080x24; else screen=3840x2160x24; fi
            if [ '${{ matrix.lane }}' = stable ]; then
              export KARIN_TEST_CAPTURE_DIR="$GITHUB_WORKSPACE/build/ui-captures/fixtures/native-music-$scale"
            fi
            GDK_SCALE="$scale" dbus-run-session -- xvfb-run -a -s "-screen 0 $screen -dpi 96" cargo test --lib --all-features --locked native_catalog_native_music_layout -- --ignored --test-threads=1
            G_DEBUG=fatal-warnings GDK_SCALE="$scale" dbus-run-session -- xvfb-run -a -s "-screen 0 $screen -dpi 96" cargo test --lib --all-features --locked native_collection_filter_continuation_and_exact_occurrences -- --ignored --test-threads=1
            G_DEBUG=fatal-warnings GDK_SCALE="$scale" dbus-run-session -- xvfb-run -a -s "-screen 0 $screen -dpi 96" cargo test --lib --all-features --locked native_music_shuffle_repeat_mpris_shared_policy_and_eos -- --ignored --test-threads=1
            GDK_SCALE="$scale" dbus-run-session -- xvfb-run -a -s "-screen 0 $screen -dpi 96" cargo test --lib --all-features --locked native_queue_space_mouse_enter_dispatch_exact_occurrence_once -- --ignored --test-threads=1
          done
      - name: Persistent session lifecycle and catalog cache provenance integration
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
          GSK_DEBUG: full-redraw
        run: |
          if [ '${{ matrix.lane }}' = stable ]; then
            export KARIN_TEST_CAPTURE_DIR="$GITHUB_WORKSPACE/build/ui-captures/fixtures"
          fi
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24 -dpi 96' cargo test --lib --all-features --locked native_persistent_session_restore_settings_forget_and_close -- --ignored --test-threads=1
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24 -dpi 96' cargo test --lib --all-features --locked native_catalog_cache_provenance_interleaving_and_retired_replies -- --ignored --test-threads=1
      - name: Audio cache through the normal app and real process restart
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
          G_DEBUG: fatal-warnings
          KARIN_TEST_CAPTURE_DIR: ${{ github.workspace }}/build/ui-captures/fixtures/audio-cache-application
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24 -dpi 96' cargo test --lib --all-features --locked native_audio_cache_application_process_restart -- --ignored --test-threads=1 --nocapture
      - name: Playback continuation, confirmed playlist edits and live appearance in the normal app
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
          G_DEBUG: fatal-warnings
        run: |
          for scale in 1 2; do
            export GDK_SCALE="$scale"
            export KARIN_TEST_CAPTURE_DIR="$GITHUB_WORKSPACE/build/ui-captures/fixtures/v07-application/scale-$scale"
            if [ "$scale" = 2 ]; then screen=3840x2160; else screen=1920x1080; fi
            dbus-run-session -- xvfb-run -a -s "-screen 0 ${screen}x24 -dpi 96" cargo test --lib --all-features --locked native_v07_playback_restore_playlist_appearance_process_restart -- --ignored --test-threads=1 --nocapture
          done
      - name: Integrated lyrics, similar tracks, complete collection index and queue input
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
          G_DEBUG: fatal-warnings
        run: |
          for scale in 1 2; do
            export GDK_SCALE="$scale"
            export KARIN_TEST_CAPTURE_DIR="$GITHUB_WORKSPACE/build/ui-captures/fixtures/v08-application/scale-$scale"
            mkdir -p "$KARIN_TEST_CAPTURE_DIR"
            if [ "$scale" = 2 ]; then screen=3840x2160; else screen=1920x1080; fi
            dbus-run-session -- xvfb-run -a -s "-screen 0 ${screen}x24 -dpi 96" cargo test --lib --all-features --locked native_v08_lyrics_similar_seek_and_stale_selection -- --ignored --test-threads=1 --nocapture
            dbus-run-session -- xvfb-run -a -s "-screen 0 ${screen}x24 -dpi 96" cargo test --lib --all-features --locked native_v08_whole_collection_index_search_sort_and_cancellation -- --ignored --test-threads=1 --nocapture
            dbus-run-session -- xvfb-run -a -s "-screen 0 ${screen}x24 -dpi 96" cargo test --lib --all-features --locked native_v08_queue_next_drag_keyboard_and_restoration -- --ignored --test-threads=1 --nocapture
            dbus-run-session -- xvfb-run -a -s "-screen 0 ${screen}x24 -dpi 96" cargo test --lib --all-features --locked native_v08_incremental_marker_updates_and_stable_ticks -- --ignored --test-threads=1 --nocapture 2>&1 | tee "$KARIN_TEST_CAPTURE_DIR/marker-work.log"
            python3 scripts/check-marker-work.py "$KARIN_TEST_CAPTURE_DIR/marker-work.log"
          done
      - name: Persistent session and catalog cache integration at HiDPI
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
          GSK_DEBUG: full-redraw
          GDK_SCALE: 2
        run: |
          if [ '${{ matrix.lane }}' = stable ]; then
            export KARIN_TEST_CAPTURE_DIR="$GITHUB_WORKSPACE/build/ui-captures/fixtures/hidpi"
          fi
          dbus-run-session -- xvfb-run -a -s '-screen 0 3840x2160x24 -dpi 96' cargo test --lib --all-features --locked native_persistent_session_restore_settings_forget_and_close -- --ignored --test-threads=1
          dbus-run-session -- xvfb-run -a -s '-screen 0 3840x2160x24 -dpi 96' cargo test --lib --all-features --locked native_catalog_cache_provenance_interleaving_and_retired_replies -- --ignored --test-threads=1
      - name: Native Music session and catalog against loopback fixtures
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
          GSK_DEBUG: full-redraw
        run: |
          if [ '${{ matrix.lane }}' = stable ]; then
            export KARIN_TEST_CAPTURE_DIR="$GITHUB_WORKSPACE/build/ui-captures/fixtures"
          fi
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24 -dpi 96' cargo test --lib --all-features --locked native_music_session_catalog_queue_and_logout -- --ignored --test-threads=1
      - name: Ordinary Wave with the shared native player, feedback and cleanup
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
          GSK_DEBUG: full-redraw
        run: |
          if [ '${{ matrix.lane }}' = stable ]; then
            export KARIN_TEST_CAPTURE_DIR="$GITHUB_WORKSPACE/build/ui-captures/fixtures"
          fi
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24 -dpi 96' cargo test --lib --all-features --locked native_wave_shared_player_feedback_batches_and_cleanup -- --ignored --test-threads=1
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24 -dpi 96' cargo test --lib --all-features --locked native_wave_retirement_supported_feedback_and_cleanup -- --ignored --test-threads=1
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24 -dpi 96' cargo test --lib --all-features --locked native_wave_home_experiment_layout_and_controls -- --ignored --test-threads=1
          GDK_SCALE=2 GDK_DPI_SCALE=1 dbus-run-session -- xvfb-run -a -s '-screen 0 3840x2160x24 -dpi 96' cargo test --lib --all-features --locked native_wave_shared_player_feedback_batches_and_cleanup -- --ignored --test-threads=1
          GDK_SCALE=2 GDK_DPI_SCALE=1 dbus-run-session -- xvfb-run -a -s '-screen 0 3840x2160x24 -dpi 96' cargo test --lib --all-features --locked native_wave_retirement_supported_feedback_and_cleanup -- --ignored --test-threads=1
          GDK_SCALE=2 GDK_DPI_SCALE=1 dbus-run-session -- xvfb-run -a -s '-screen 0 3840x2160x24 -dpi 96' cargo test --lib --all-features --locked native_wave_home_experiment_layout_and_controls -- --ignored --test-threads=1
      - name: Native catalog concurrent actions, detail navigation and stale results
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
        run: |
          if [ '${{ matrix.lane }}' = stable ]; then
            export KARIN_TEST_CAPTURE_DIR="$GITHUB_WORKSPACE/build/ui-captures/fixtures"
          fi
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24 -dpi 96' cargo test --lib --all-features --locked native_catalog_navigation_latest_actions -- --ignored --test-threads=1
      - name: Build all optional authentication components
        run: cargo build --workspace --all-features --locked
      - name: Actual mouse and keyboard catalog rows, details and delivery entry
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
          GSK_DEBUG: full-redraw
        run: |
          if [ '${{ matrix.lane }}' = stable ]; then
