name: Rust and native diagnostics

on:
  push:
    branches: [master, 'feature/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [master, 'feature/v0.1-oauth-pkce-diagnostic']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Rust ${{ matrix.toolchain }} (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: stable
            toolchain: stable
          - lane: msrv
            toolchain: '1.98.1'
            rust-version: '1.98'
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      RUST_BACKTRACE: 1
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node.js 24
      - name: Install native development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libadwaita-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libssl-dev libdbus-1-dev libsecret-1-dev dbus-x11 xvfb xauth \
            librsvg2-common openbox imagemagick xdotool wmctrl x11-utils
      - name: Install selected Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustc --version
          cargo --version
      - name: Keep the MSRV lane aligned with Cargo metadata
        if: matrix.lane == 'msrv'
        env:
          EXPECTED_RUST_VERSION: ${{ matrix.rust-version }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          declared = tomllib.loads(Path("Cargo.toml").read_text())["package"]["rust-version"]
          expected = os.environ["EXPECTED_RUST_VERSION"]
          assert declared == expected, f"Cargo.toml declares {declared}; update the MSRV CI lane ({expected}) together"
          PY
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Verify public build policy
        run: |
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          cargo = tomllib.loads(Path("Cargo.toml").read_text())
          features = cargo.get("features", {})
          pending = list(features.get("default", []))
          seen = set()
          while pending:
              feature = pending.pop()
              if feature not in seen:
                  seen.add(feature)
                  pending.extend(features.get(feature, []))
          assert "experimental-device-auth" not in seen, "Experimental OAuth must remain opt-in"
          manifest = json.loads(Path("packaging/flatpak/io.github.tracerxbrhd.Karin.json").read_text())
          commands = manifest["modules"][0]["build-commands"]
          assert "cargo build --release --offline --locked --no-default-features" in commands
          assert all("--all-features" not in command and "--features" not in command for command in commands)
          assert all("--experimental-music" not in command for command in commands)
          assert not any(arg.startswith("--filesystem=") or "org.freedesktop.secrets" in arg for arg in manifest["finish-args"])
          PY
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Experimental feature Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Unit and local integration tests
        run: cargo test --workspace --locked
      - name: Experimental feature tests (synthetic local HTTP only)
        run: cargo test --workspace --all-features --locked
      - name: Native Music session and catalog against loopback fixtures
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
          GSK_DEBUG: full-redraw
        run: |
          if [ '${{ matrix.lane }}' = stable ]; then
            export KARIN_TEST_CAPTURE_DIR="$GITHUB_WORKSPACE/build/ui-captures/fixtures"
          fi
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24 -dpi 96' cargo test --lib --all-features --locked native_music_session_catalog_queue_and_logout -- --ignored --test-threads=1
      - name: Build opted-in experimental client
        run: cargo build --workspace --features experimental-device-auth --locked
      - name: Experimental GTK startup and cleanup under Xvfb
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24 -dpi 96' ./target/debug/karin --experimental-music --smoke-test
      - name: Build public client without experimental authentication
        run: cargo build --workspace --no-default-features --locked
      - name: Local OAuth terminal boundaries (synthetic input, no browser or network)
        run: python3 scripts/test-oauth-terminal.py ./target/debug/karin
      - name: Fetch locked dependencies for the offline release build
        if: matrix.lane == 'msrv'
        run: cargo fetch --locked
      - name: Flatpak-style offline release build on MSRV
        if: matrix.lane == 'msrv'
        run: cargo build --release --offline --locked --no-default-features
      - name: Release OAuth terminal boundaries on MSRV
        if: matrix.lane == 'msrv'
        run: python3 scripts/test-oauth-terminal.py ./target/release/karin
      - name: Verify reviewed dependency license inventory
        run: |
          python3 packaging/license_inventory.py --output /tmp/karin-dependency-licenses.md
          diff -u docs/DEPENDENCY_LICENSES.md /tmp/karin-dependency-licenses.md
      - name: GStreamer diagnostic through fakesink
        run: ./target/debug/karin --audio-self-test
      - name: Generated local media through the real playback controller
        run: ./target/debug/karin --playback-self-test
      - name: GTK startup and shutdown under Xvfb
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24 -dpi 96' ./target/debug/karin --smoke-test
      - name: Release GStreamer diagnostic through fakesink on MSRV
        if: matrix.lane == 'msrv'
        run: ./target/release/karin --audio-self-test
      - name: Release playback controller on MSRV
        if: matrix.lane == 'msrv'
        run: ./target/release/karin --playback-self-test
      - name: Release GTK startup and shutdown under Xvfb on MSRV
        if: matrix.lane == 'msrv'
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24 -dpi 96' ./target/release/karin --smoke-test
      - name: Opted-in offline release build on MSRV
        if: matrix.lane == 'msrv'
        run: cargo build --release --offline --locked --features experimental-device-auth
      - name: Experimental release GTK startup and cleanup on MSRV
        if: matrix.lane == 'msrv'
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24 -dpi 96' ./target/release/karin --experimental-music --smoke-test
      - name: Restore public release artifact on MSRV
        if: matrix.lane == 'msrv'
        run: cargo build --release --offline --locked --no-default-features
      - name: Capture real GTK visual review matrix
        if: matrix.lane == 'stable'
        run: scripts/capture-ui.sh build/ui-captures
      - name: Retain visual review evidence
        if: always() && matrix.lane == 'stable'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node.js 24
        with:
          name: karin-ui-${{ github.sha }}
          path: |
            build/ui-captures/**/*.png
            build/ui-captures/**/*.geometry.txt
            build/ui-captures/capture-info.txt
          retention-days: 7
          if-no-files-found: error
