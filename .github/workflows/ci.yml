name: Rust and native diagnostics

on:
  push:
    branches: [master, 'feature/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install native development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libadwaita-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libssl-dev libdbus-1-dev libsecret-1-dev dbus-x11 xvfb xauth
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version
          cargo --version
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit and local integration tests
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --workspace --locked
      - name: GStreamer diagnostic through fakesink
        run: ./target/debug/karin --audio-self-test
      - name: GTK startup and shutdown under Xvfb
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
        run: dbus-run-session -- xvfb-run -a ./target/debug/karin --smoke-test
